<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/base :: head"></head>
<body>
<div th:replace="layout/base :: navbar"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between mb-3">
        <h3>Usuarios</h3>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">Nuevo usuario</a>
    </div>
    <table class="table table-striped">
        <thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.nombre}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.rol.nombre}"></td>
            <td>
                <a th:href="@{'/usuarios/editar/' + ${u.id}}" class="btn btn-sm btn-secondary">Editar</a>
                <a th:href="@{'/usuarios/eliminar/' + ${u.id}}" class="btn btn-sm btn-danger">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div th:replace="layout/base :: footer"></div>
</body>
</html>
