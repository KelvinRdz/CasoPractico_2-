<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout/base :: head"></head>

<body>

    <div th:replace="layout/base :: navbar"></div>

    <div class="container mt-4">

        <div class="card p-3">

            <h3>Formulario de Cita</h3>

            <form th:action="@{/citas/guardar}"
                  th:object="${cita}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Paciente</label>
                    <input type="text"
                           th:field="*{pacienteNombre}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Especialidad</label>
                    <input type="text"
                           th:field="*{especialidad}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha</label>
                    <input type="date"
                           th:field="*{fecha}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Costo</label>
                    <input type="number"
                           step="0.01"
                           th:field="*{costo}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox"
                           th:field="*{activa}"
                           class="form-check-input">

                    <label class="form-check-label">
                        Activa
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">
                    Guardar
                </button>

                <a th:href="@{/citas}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>

    </div>

    <div th:replace="layout/base :: footer"></div>

</body>
</html>
