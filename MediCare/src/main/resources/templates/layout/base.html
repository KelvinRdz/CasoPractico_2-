<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:fragment="head">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>MediCare</title>
        <link href="/css/app.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>
        <div th:fragment="navbar">
            <nav class="navbar navbar-expand-lg" style="background-color:#6366F1;">
                <div class="container-fluid">
                    <a class="navbar-brand text-white" href="/dashboard">MediCare</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link text-white" th:href="@{/citas}">Citas</a></li>
                            <li class="nav-item"><a class="nav-link text-white" th:href="@{/consultas}">Consultas</a></li>
                            <li class="nav-item"><a class="nav-link text-white" th:href="@{/usuarios}">Usuarios</a></li>
                            <li class="nav-item"><a class="nav-link text-white" th:href="@{/roles}">Roles</a></li>
                            <li class="nav-item"><a class="nav-link text-white" th:href="@{/logout}">Cerrar sesión</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>

        <div th:fragment="footer">
            <footer class="text-center mt-5 p-3" style="background-color:#1E293B;color:white;">
                <div>© MediCare - Sistema de Gestión de Citas Médicas</div>
            </footer>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        </div>
    </body>
</html>
