<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/base :: head"></head>
<body>
    <div th:replace="layout/base :: navbar"></div>

    <div class="container mt-4">
        <div class="card p-3 mb-3">
            <h4>Consultas avanzadas</h4>
            <form method="get" action="/consultas" class="row gy-2 gx-2">
                <div class="col-md-3">
                    <label>Activa</label>
                    <select name="activa" class="form-control">
                        <option value="">--</option>
                        <option value="true">Activas</option>
                        <option value="false">Inactivas</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label>Inicio</label>
                    <input type="date" name="inicio" class="form-control">
                </div>
                <div class="col-md-3">
                    <label>Fin</label>
                    <input type="date" name="fin" class="form-control">
                </div>
                <div class="col-md-3">
                    <label>Especialidad</label>
                    <input type="text" name="especialidad" class="form-control">
                </div>
                <div class="col-md-12 mt-2">
                    <button class="btn btn-primary">Buscar</button>
                </div>
            </form>
        </div>

        <div>
            <table class="table">
                <thead><tr><th>ID</th><th>Paciente</th><th>Especialidad</th><th>Fecha</th><th>Costo</th><th>Activa</th></tr></thead>
                <tbody>
                <tr th:each="c : ${resultados}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.pacienteNombre}"></td>
                    <td th:text="${c.especialidad}"></td>
                    <td th:text="${c.fecha}"></td>
                    <td th:text="${c.costo}"></td>
                    <td th:text="${c.activa}? 'Sí' : 'No'"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="layout/base :: footer"></div>
</body>
</html>
